name: Refresh live gameweek

on:
  schedule:
    # Asked for every five minutes; GitHub does not oblige. Measured across a
    # match day, this repo gets a scheduled run roughly once an hour whatever
    # the cron says, and the same was true of the */10 it replaced -- the
    # schedule event is best-effort and high-frequency crons are dropped under
    # load. So the cron is a wake-up call, not the cadence: once awake, the job
    # below stays alive through the match and republishes itself every five
    # minutes.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_live_data.py'
      - 'scripts/live_calc.py'
      - '.github/workflows/refresh-live.yml'

permissions:
  contents: write

concurrency:
  group: refresh-live-data
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    # The publishing loop runs for at most PUBLISH_WINDOW_MINUTES; this is the
    # backstop if something wedges.
    timeout-minutes: 140
    env:
      # How long one run keeps publishing for, and how far ahead it will wait
      # for a kick-off.
      #
      # This was 55, on the assumption that scheduled runs arrive about hourly
      # so the windows would meet. Measured on 23 August they did not: runs
      # landed at 09:56, 10:55, 11:46 and then not again until 13:41 -- a gap
      # of 115 minutes straddling a 13:00 kick-off. The 11:46 run found nothing
      # in play, exited in nine seconds, and the first half went unpublished.
      #
      # So the window is set above the worst gap actually observed rather than
      # the one the cron promises. A run that wakes with football coming stays
      # up for it; on a day with none it still exits in seconds.
      PUBLISH_WINDOW_MINUTES: 120
      # Matches the script's own LIVE_REFRESH_MINUTES.
      PUBLISH_EVERY_SECONDS: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The bonus, substitution and award arithmetic is pure and testable, so
      # it is tested whenever it changes. Skipped on the schedule, where it
      # would just burn a few seconds every run to re-prove code that has not
      # moved.
      - name: Test the scoring arithmetic
        if: github.event_name != 'schedule'
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Publish through the match window
        env:
          # A manual run or a change to the code always publishes, so there is
          # a way to force a refresh without waiting for a match. Only the
          # first pass is forced -- after that each pass publishes on its own
          # merits, or the loop would commit every five minutes on a quiet day.
          FORCE_FIRST_PASS: ${{ github.event_name != 'schedule' }}
        run: |
          set -euo pipefail
          git config user.name "fpl-jakarta-bot"
          git config user.email "actions@users.noreply.github.com"

          # How the script answers back. A key it has not written reads as
          # "None", which is not "True", so an older status file simply stops
          # the loop rather than confusing it.
          status() { python -c "import json,sys;print(json.load(open('.live-run-status')).get(sys.argv[1]))" "$1"; }

          # PUBLISH_WINDOW_MINUTES reaches the script through the job env, so
          # it bounds "a kick-off is imminent" by this same window and never
          # asks the loop to wait for football the job will not still be up for.
          deadline=$(( $(date +%s) + PUBLISH_WINDOW_MINUTES * 60 ))
          export FORCE_PUBLISH="$FORCE_FIRST_PASS"
          pass=0

          while : ; do
            pass=$(( pass + 1 ))
            echo "::group::Pass $pass"
            python scripts/fetch_live_data.py
            export FORCE_PUBLISH=false

            published=$(status published)
            in_play=$(status in_play)
            starts_soon=$(status starts_soon)
            echo "published=$published in_play=$in_play starts_soon=$starts_soon"

            if [ "$published" = "True" ]; then
              # live.json and awards.json are generated whole every pass, so
              # there is never anything to merge -- the copy just written is by
              # definition the newest. Rebasing onto main used to be how this
              # handled a concurrent push, and on 23 August it failed: run #34
              # sat in the concurrency queue behind a long run, started from a
              # 39-minute-old checkout, and rebasing its rewrite of live.json
              # onto three newer rewrites conflicted immediately. Two full
              # rewrites of the same JSON never auto-merge.
              #
              # So take main as it stands and put our files on top of it. The
              # longer publish window makes a queued run staler still, which is
              # exactly when the old approach broke.
              for attempt in 1 2 3; do
                git fetch origin main
                cp live.json awards.json "$RUNNER_TEMP/"
                git reset --hard origin/main
                cp "$RUNNER_TEMP/live.json" "$RUNNER_TEMP/awards.json" .
                git add live.json awards.json
                if git diff --staged --quiet; then
                  echo "Nothing changed against main; nothing to push."
                  break
                fi
                git commit -m "Refresh live gameweek"
                if git push; then
                  break
                fi
                echo "Push rejected (attempt $attempt) -- someone else got there first."
                if [ "$attempt" = "3" ]; then
                  echo "::warning::Could not push after 3 attempts; the next pass will try again."
                fi
              done
            fi
            echo "::endgroup::"

            # Stay awake through a match, and through the wait for one about
            # to start. A run that wakes before kick-off and exits leaves the
            # half that follows to a scheduled run that may be two hours off.
            # A waiting pass costs two API calls -- it stops well before the
            # manager fetch -- so the wait is cheap.
            if [ "$in_play" != "True" ] && [ "$starts_soon" != "True" ]; then
              echo "No match being played and none due inside the window."
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Window closed after $PUBLISH_WINDOW_MINUTES minutes; the next run takes over."
              break
            fi
            sleep "$PUBLISH_EVERY_SECONDS"
          done
