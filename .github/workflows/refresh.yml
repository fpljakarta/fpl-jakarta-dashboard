name: Refresh FPL data

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_fpl_data.py'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: refresh-fpl-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch FPL data
        id: fetch
        run: python scripts/fetch_fpl_data.py

      - name: Commit data if it changed
        if: steps.fetch.outputs.publish == 'true'
        run: |
          git config user.name "fpl-jakarta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json prices.json
          git diff --staged --quiet || git commit -m "Refresh FPL data"
          # The live gameweek job may have pushed while we were fetching.
          git pull --rebase --autostash origin main
          git push
