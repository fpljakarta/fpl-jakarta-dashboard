name: Refresh live gameweek

on:
  schedule:
    # Asked for every five minutes; GitHub does not oblige. Measured across a
    # match day, this repo gets a scheduled run roughly once an hour whatever
    # the cron says, and the same was true of the */10 it replaced -- the
    # schedule event is best-effort and high-frequency crons are dropped under
    # load. So the cron is a wake-up call, not the cadence: once awake, the job
    # below stays alive through the match and republishes itself every five
    # minutes.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if nothing has changed"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_live_data.py'
      - 'scripts/live_calc.py'
      - '.github/workflows/refresh-live.yml'

permissions:
  contents: write

concurrency:
  group: refresh-live-data
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    # The publishing loop runs for at most PUBLISH_WINDOW_MINUTES; this is the
    # backstop if something wedges.
    timeout-minutes: 330
    env:
      # How long one run keeps publishing for, and how far ahead it will wait
      # for a kick-off or a gameweek deadline.
      #
      # This started at 55 on the assumption that scheduled runs arrive about
      # hourly. They do not. On 23 August the gap was 115 minutes and straddled
      # a kick-off, which took it to 120. Then GitHub delivered no scheduled run
      # at all on 27 August, and none between 01:31 and 19:21 on the 28th -- so
      # the GW2 deadline at 17:30 passed with the site still showing GW1.
      #
      # No window survives a 34-hour gap. What a wide one does is make each
      # delivered run worth far more: five hours of cover, and a run that wakes
      # any time that afternoon carries the site through the deadline. Six hours
      # is GitHub's hard cap on a job, so this is most of what is available.
      #
      # It costs nothing on a quiet day. The run only stays up when there is
      # football on, football coming, or a deadline coming; otherwise it still
      # exits in seconds.
      PUBLISH_WINDOW_MINUTES: 300
      # Matches the script's own LIVE_REFRESH_MINUTES.
      PUBLISH_EVERY_SECONDS: 300
      # How long a fetcher may spend riding out an FPL outage. FPL answers 503
      # across its endpoints while a gameweek rolls over -- which is the moment
      # this run exists for -- so giving up in seconds forfeits the run. Set
      # here rather than left to each script's default because the standings
      # fetch runs inside this loop, and its own default of ten minutes would
      # put a five-minute cadence badly out of step.
      FETCH_RETRY_BUDGET_SECONDS: 120
      # Consecutive failed live fetches before the run gives up. Five passes is
      # about twenty-five minutes of solid failure -- long enough to be sure it
      # is not a passing outage, short enough not to hold a runner all window.
      LIVE_FAIL_LIMIT: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The bonus, substitution and award arithmetic is pure and testable, so
      # it is tested whenever it changes. Skipped on the schedule, where it
      # would just burn a few seconds every run to re-prove code that has not
      # moved.
      - name: Test the scoring arithmetic
        if: github.event_name != 'schedule'
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Publish through the match window
        env:
          # A change to the code always publishes, and a person can tick the
          # force box to refresh without waiting for a match. Only the first
          # pass is forced -- after that each pass publishes on its own merits,
          # or the loop would commit every five minutes on a quiet day.
          #
          # A dispatch does NOT force by default, because the external trigger
          # (see the README) dispatches this workflow on a schedule of its own.
          # If every one of those forced a publish, a quiet day would carry a
          # commit an hour saying nothing had happened.
          FORCE_FIRST_PASS: ${{ github.event_name == 'push' || inputs.force || false }}
        run: |
          set -euo pipefail
          git config user.name "fpl-jakarta-bot"
          git config user.email "actions@users.noreply.github.com"

          # How the script answers back. A key it has not written reads as
          # "None", which is not "True", so an older status file simply stops
          # the loop rather than confusing it.
          status() { python -c "import json,sys;print(json.load(open('.live-run-status')).get(sys.argv[1]))" "$1"; }

          # PUBLISH_WINDOW_MINUTES reaches the script through the job env, so
          # it bounds "a kick-off is imminent" by this same window and never
          # asks the loop to wait for football the job will not still be up for.
          deadline=$(( $(date +%s) + PUBLISH_WINDOW_MINUTES * 60 ))
          export FORCE_PUBLISH="$FORCE_FIRST_PASS"
          pass=0
          live_fails=0

          # data.json carries the gameweek number, the standings, the deadline
          # and the monthly and weekly winners. It used to be refreshed only by
          # the hourly workflow, which meant a delivered run of *this* one left
          # the home page on the old gameweek -- exactly what happened at the
          # GW2 rollover. Now whichever workflow gets a run brings the whole
          # site current. It is the more expensive fetch, so it runs on the
          # first pass and then every half hour rather than every five minutes.
          slow_every=$(( 1800 / PUBLISH_EVERY_SECONDS ))
          [ "$slow_every" -lt 1 ] && slow_every=1

          while : ; do
            pass=$(( pass + 1 ))
            echo "::group::Pass $pass"
            # Live first: it is the cheap one, and it is the one that notices
            # the gameweek has moved. The standings fetch then runs on the first
            # pass, on the slow cadence -- and immediately when the gameweek
            # did move, rather than up to half an hour after the rollover the
            # whole run stayed awake for.
            # A failed live fetch must not take the run down with it. This
            # step runs under `set -e`, so an unguarded failure ends the whole
            # loop -- including the long run whose entire job is to be awake
            # across a deadline, at precisely the moment FPL is most likely to
            # be answering 503. So skip the pass, keep the loop, and let the
            # next pass try again; give up only if it keeps failing, so a
            # genuinely broken script cannot hold a runner for the whole window.
            if python scripts/fetch_live_data.py; then
              live_fails=0
            else
              live_fails=$(( live_fails + 1 ))
              echo "::warning::live fetch failed ($live_fails in a row); skipping this pass"
              echo "::endgroup::"
              if [ "$live_fails" -ge "$LIVE_FAIL_LIMIT" ]; then
                echo "::error::live fetch failed $live_fails times running; giving up."
                exit 1
              fi
              # Nothing was written, so there is nothing to commit and the
              # status file still holds the previous pass. Wait and retry
              # rather than acting on either.
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "Window closed after $PUBLISH_WINDOW_MINUTES minutes; the next run takes over."
                break
              fi
              sleep "$PUBLISH_EVERY_SECONDS"
              continue
            fi
            export FORCE_PUBLISH=false

            published=$(status published)
            in_play=$(status in_play)
            starts_soon=$(status starts_soon)
            deadline_soon=$(status deadline_soon)
            gw_changed=$(status gw_changed)
            echo "published=$published in_play=$in_play starts_soon=$starts_soon deadline_soon=$deadline_soon gw_changed=$gw_changed"

            if [ "$pass" = "1" ] || [ "$gw_changed" = "True" ] \
               || [ $(( (pass - 1) % slow_every )) = "0" ]; then
              python scripts/fetch_fpl_data.py || \
                echo "::warning::standings refresh failed; carrying on with the live data"
            fi

            # Only the files this pass actually rewrote are ours to push. Each
            # fetcher leaves a file untouched when it has nothing new, so the
            # working tree against the checkout is an exact record of what we
            # wrote -- and carrying anything else forward would push a stale
            # copy over a newer one. A queued run can start hours behind main,
            # so a run that only refreshed the standings would otherwise roll
            # live scores back to whatever they were when it was queued.
            # status, not diff: `git diff` says nothing about a file git has
            # never seen, so the first run after a new data file is added would
            # quietly never commit it. That is exactly what happened to
            # transfers.json. --porcelain lists modified and untracked alike.
            mine=$(git status --porcelain -- live.json awards.json data.json prices.json transfers.json | awk '{print $2}' | sort -u)
            if [ -n "$mine" ]; then
              # These files are generated whole, so there is never anything to
              # merge -- the copy just written is by definition the newest.
              # Rebasing onto main used to be how this handled a concurrent
              # push, and on 23 August it failed: run #34 sat in the queue
              # behind a long run, started from a 39-minute-old checkout, and
              # rebasing its rewrite of live.json onto three newer rewrites
              # conflicted immediately. Two full rewrites never auto-merge.
              #
              # So take main as it stands and put ours on top. The wider window
              # makes a queued run staler still, which is when this broke.
              cp $mine "$RUNNER_TEMP/"
              for attempt in 1 2 3; do
                git fetch origin main
                git reset --hard origin/main
                for f in $mine; do cp "$RUNNER_TEMP/$f" "$f"; done
                git add $mine
                if git diff --staged --quiet; then
                  echo "Nothing changed against main; nothing to push."
                  break
                fi
                # The history is the record of what moved, so say which.
                case "$mine" in
                  *live.json*|*awards.json*) msg="Refresh live gameweek" ;;
                  *)                         msg="Refresh FPL data" ;;
                esac
                git commit -m "$msg"
                if git push; then
                  break
                fi
                echo "Push rejected (attempt $attempt) -- someone else got there first."
                if [ "$attempt" = "3" ]; then
                  echo "::warning::Could not push after 3 attempts; the next pass will try again."
                fi
              done
            fi
            echo "::endgroup::"

            # Stay awake through a match, through the wait for one about to
            # start, and through the wait for a gameweek deadline. A run that
            # wakes before any of those and exits leaves what follows to a
            # scheduled run that may be a day and a half off. A waiting pass
            # stops well before the manager fetch, so the wait is cheap.
            if [ "$in_play" != "True" ] && [ "$starts_soon" != "True" ] \
               && [ "$deadline_soon" != "True" ]; then
              echo "No football on, none due, and no deadline inside the window."
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Window closed after $PUBLISH_WINDOW_MINUTES minutes; the next run takes over."
              break
            fi
            sleep "$PUBLISH_EVERY_SECONDS"
          done
