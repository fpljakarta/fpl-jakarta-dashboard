name: Refresh FPL data

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_fpl_data.py'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: refresh-fpl-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch FPL data
        id: fetch
        run: python scripts/fetch_fpl_data.py

      - name: Commit data if it changed
        if: steps.fetch.outputs.publish == 'true'
        run: |
          set -euo pipefail
          git config user.name "fpl-jakarta-bot"
          git config user.email "actions@users.noreply.github.com"

          # Only the files this run rewrote, named by the diff rather than by a
          # fixed list -- the fetcher leaves a file alone when it has nothing
          # new, and a list has to be remembered every time one is added.
          # status, not diff: `git diff` says nothing about a file git has never
          # seen, so a newly added data file would quietly never be committed.
          mine=$(git status --porcelain -- data.json prices.json transfers.json | awk '{print $2}' | sort -u)
          if [ -z "$mine" ]; then
            echo "Nothing was rewritten; nothing to push."
            exit 0
          fi

          # These are generated whole, so there is nothing to merge and the copy
          # just written is the newest. This used to rebase onto main, which is
          # how the live workflow's run #34 died on 23 August: two full rewrites
          # of the same JSON never auto-merge. Take main as it stands and put
          # ours on top of it instead.
          cp $mine "$RUNNER_TEMP/"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            for f in $mine; do cp "$RUNNER_TEMP/$f" "$f"; done
            git add $mine
            if git diff --staged --quiet; then
              echo "Nothing changed against main; nothing to push."
              break
            fi
            git commit -m "Refresh FPL data"
            if git push; then
              break
            fi
            echo "Push rejected (attempt $attempt) -- someone else got there first."
            if [ "$attempt" = "3" ]; then
              echo "::warning::Could not push after 3 attempts; the next run will try again."
            fi
          done
